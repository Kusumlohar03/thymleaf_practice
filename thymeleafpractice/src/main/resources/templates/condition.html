<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8" />
	<title>Thymeleaf Conditions</title>
</head>
<body>
	<h1>Thymeleaf Conditions</h1>

	<h2>User is <span th:text="${isActive} ? 'active' : 'Not active'"></span></h2>
	
	<h1 th:if="${gender} == 'F'">Female</h1>
	<h1 th:unless="${gender} == 'F'">Male</h1>
	
	<div th:switch="${#lists.size(mylist)}">
		<h1 th:case="0">List contain 0 element</h1>
		<h1 th:case="1">List contain 1 element</h1>
		<h1 th:case="*">List contain more than 1 element</h1>
	</div>
</body>
</html>
